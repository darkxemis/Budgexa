# nginx.conf temporal SOLO para obtener el certificado inicial
# Se usa automáticamente por el script init-letsencrypt.sh
server {
    listen 80;
    listen [::]:80;
    server_name budgexaclient.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'Waiting for SSL certificate...';
        add_header Content-Type text/plain;
    }
}
