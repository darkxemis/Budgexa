# nginx.conf for serving Angular with HTTPS (production)
server {
    listen 80;
    listen [::]:80;
    server_name budgexaclient.duckdns.org;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name budgexaclient.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/budgexaclient.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/budgexaclient.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    location ^~ /scalar {
        proxy_pass http://budgexaapi:80/scalar;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /openapi/ {
        proxy_pass http://budgexaapi:80/openapi/;
        proxy_set_header Host $host;
    }

    location ^~ /_content/ {
        proxy_pass http://budgexaapi:80/_content/;
        proxy_set_header Host $host;
    }

    location ^~ /signature-images/ {
        proxy_pass http://budgexaapi:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /profile-images/ {
        proxy_pass http://budgexaapi:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        proxy_pass http://budgexaapi:80/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
