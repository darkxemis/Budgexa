services:
  sqlserver:
    container_name: budgexa-sqlserver
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - SA_PASSWORD=${SA_PASSWORD}
      - ACCEPT_EULA=Y
    volumes:
      - sqlserver-data:/var/opt/mssql
    ports:
      - "1433:1433"
    networks:
      - budgexa-net
    restart: always

  ollama:
    container_name: budgexa-ollama
    image: ollama/ollama:latest
    ports:
      - "11435:11435"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - budgexa-net
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0:11435
      - OLLAMA_CONTEXT_LENGTH=8192
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_FLASH_ATTENTION=1
    cpus: 2
    mem_limit: 3g
    pids_limit: 128
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  budgexaapi:
    container_name: budgexa-api
    build:
      context: .
      dockerfile: backend/BudgexaApi/src/Budgexa.API/Dockerfile
    networks:
      - budgexa-net
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING}
      - JwtSettings__Secret=${JWT_SECRET}
      - Ollama__BaseUrl=http://192.168.1.69:11435
      - Ollama__DefaultModel=qwen2.5-coder:1.5b
      - ASPNETCORE_URLS=http://+:80
      - Cors__AllowedOrigins__0=https://budgexaclient.duckdns.org
      - FileStorage__ProfileImagesPath=/app/uploads/profile-images
      - FileStorage__SignatureImagesPath=/app/uploads/signature-images
      - FileStorage__BaseUrl=https://budgexaclient.duckdns.org
    volumes:
      - profile-images:/app/uploads/profile-images
      - signature-images:/app/uploads/signature-images
    depends_on:
      - sqlserver
      - ollama
    restart: always

  budgexa-client:
    container_name: budgexa-client
    build:
      context: ./frontend/budgexa-client
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot:ro
    networks:
      - budgexa-net
    depends_on:
      - budgexaapi
    restart: always

  certbot:
    container_name: budgexa-certbot
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - budgexa-net

networks:
  budgexa-net:
    driver: bridge

volumes:
  sqlserver-data:
  profile-images:
  signature-images:
  ollama-data:
  certbot-etc:
    external: true
    name: budgexa_certbot-etc
  certbot-var:
    external: true
    name: budgexa_certbot-var
  certbot-www:
    external: true
    name: budgexa_certbot-www